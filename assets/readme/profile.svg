<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3130" viewBox="0 0 1200 3130" role="img" aria-labelledby="title desc">
  <title id="title">Guztchian — software engineering, AI, robotics, and thoughtful systems</title>
  <desc id="desc">A warm editorial profile introducing Guztchian, selected projects, tools, and open-source contributions. The artwork adapts automatically to light and dark themes.</desc>

  <style>
    .bg { fill: #f5f1e8; }
    .panel { fill: #eee8dc; }
    .ink { fill: #292622; }
    .muted { fill: #706960; }
    .soft { fill: #9b9287; }
    .line { stroke: #d5cdc0; }
    .accent { fill: #d97757; }
    .accent-stroke { stroke: #d97757; }
    .tile { fill: #faf7f0; stroke: #d5cdc0; }
    .activity { fill: #d8d0c4; }
    .activity-1 { fill: #edc4b5; }
    .activity-2 { fill: #df9479; }
    .activity-3 { fill: #c96345; }
    .serif { font-family: Georgia, 'Times New Roman', 'Songti SC', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .round { stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1d1a; }
      .panel { fill: #282622; }
      .ink { fill: #f1ebe1; }
      .muted { fill: #bbb2a6; }
      .soft { fill: #8d867d; }
      .line { stroke: #403d37; }
      .accent { fill: #e68a68; }
      .accent-stroke { stroke: #e68a68; }
      .tile { fill: #24221f; stroke: #403d37; }
      .activity { fill: #3a3732; }
      .activity-1 { fill: #71483b; }
      .activity-2 { fill: #a35f49; }
      .activity-3 { fill: #e68a68; }
    }
  </style>

  <rect class="bg" width="1200" height="3130" rx="28"/>

  <!-- Masthead -->
  <g id="masthead">
    <text class="sans muted" x="72" y="86" font-size="18" font-weight="600" letter-spacing="3">GUZTCHIAN / PERSONAL PROFILE</text>
    <circle class="accent" cx="1090" cy="78" r="8"/>
    <text class="sans muted" x="1062" y="115" text-anchor="end" font-size="16">Shanghai · China</text>
    <line class="line" x1="72" y1="142" x2="1128" y2="142"/>

    <text class="serif ink" x="72" y="242" font-size="74" letter-spacing="-2">Building useful systems</text>
    <text class="serif ink" x="72" y="326" font-size="74" letter-spacing="-2">with intelligence <tspan class="accent">&amp; care.</tspan></text>

    <g transform="translate(925 232)">
      <circle class="accent-stroke" cx="82" cy="82" r="70" fill="none" stroke-width="2"/>
      <circle class="accent" cx="82" cy="82" r="17"/>
      <path class="accent-stroke round" d="M82 8v39M82 117v39M8 82h39M117 82h39M30 30l28 28M106 106l28 28M134 30l-28 28M58 106l-28 28" fill="none" stroke-width="7"/>
    </g>

    <text class="sans muted" x="74" y="410" font-size="22">Software Engineering at Shanghai Jiao Tong University</text>
    <text class="sans muted" x="74" y="446" font-size="22">AI agents · computer vision · robotics · open source</text>
  </g>

  <!-- About -->
  <g id="about" transform="translate(72 548)">
    <text class="sans accent" x="0" y="0" font-size="18" font-weight="700" letter-spacing="3">01 / A LITTLE ABOUT ME</text>
    <line class="line" x1="0" y1="34" x2="1056" y2="34"/>

    <text class="serif ink" x="0" y="112" font-size="39">I wander between technology and literature —</text>
    <text class="serif ink" x="0" y="164" font-size="39">describing the world with mathematics, reshaping it</text>
    <text class="serif ink" x="0" y="216" font-size="39">with code, and understanding it through words.</text>

    <text class="sans muted" x="0" y="294" font-size="22">I am drawn to the slow, stubborn work of teaching machines to perceive, reason, and act.</text>
    <text class="sans muted" x="0" y="330" font-size="22">I am equally captivated by mathematics, physics, and space — and by the quiet audacity</text>
    <text class="sans muted" x="0" y="366" font-size="22">of trying to understand the universe.</text>

    <rect class="panel" x="0" y="420" width="1056" height="94" rx="10"/>
    <text class="serif ink" x="28" y="459" font-size="22" font-style="italic">dogogod.github.io</text>
    <text class="sans muted" x="28" y="490" font-size="18">A notebook and a quiet place to land — for technical reflections, project notes, and small moments worth keeping.</text>
    <path class="accent-stroke round" d="M1002 457h22v22M1024 457l-29 29" fill="none" stroke-width="2.5"/>
  </g>

  <!-- Selected work -->
  <g id="selected-work" transform="translate(72 1150)">
    <text class="sans accent" x="0" y="0" font-size="18" font-weight="700" letter-spacing="3">02 / SELECTED WORK</text>
    <line class="line" x1="0" y1="34" x2="1056" y2="34"/>

    <g transform="translate(0 88)">
      <text class="mono soft" x="0" y="27" font-size="18">01</text>
      <text class="serif ink" x="74" y="30" font-size="36">SJTUClaw</text>
      <text class="sans muted" x="74" y="72" font-size="20">A local AI agent runtime for personal and educational workflows, bringing conversations,</text>
      <text class="sans muted" x="74" y="104" font-size="20">tool calling, memory, Skills, scheduling, and multiple interfaces into one system.</text>
      <text class="mono accent" x="74" y="148" font-size="16">AI AGENTS · LOCAL-FIRST · TOOL USE · MEMORY</text>
      <path class="accent-stroke round" d="M1028 13h22v22M1050 13l-29 29" fill="none" stroke-width="2.5"/>
      <line class="line" x1="0" y1="182" x2="1056" y2="182"/>
    </g>

    <g transform="translate(0 304)">
      <text class="mono soft" x="0" y="27" font-size="18">02</text>
      <text class="serif ink" x="74" y="30" font-size="36">Office Preview</text>
      <text class="sans muted" x="74" y="72" font-size="20">An Obsidian plugin for previewing Word, PowerPoint, and Excel files without leaving</text>
      <text class="sans muted" x="74" y="104" font-size="20">your notes, with zoom, text copy, sheet navigation, responsive layouts, and themes.</text>
      <text class="mono accent" x="74" y="148" font-size="16">TYPESCRIPT · OBSIDIAN API · DOCX · PPTX · XLSX</text>
      <path class="accent-stroke round" d="M1028 13h22v22M1050 13l-29 29" fill="none" stroke-width="2.5"/>
      <line class="line" x1="0" y1="182" x2="1056" y2="182"/>
    </g>

    <g transform="translate(0 520)">
      <text class="mono soft" x="0" y="27" font-size="18">03</text>
      <text class="serif ink" x="74" y="30" font-size="36">WeRead</text>
      <text class="sans muted" x="74" y="72" font-size="20">A scheduled reading pipeline that collects recent WeChat articles, filters them by</text>
      <text class="sans muted" x="74" y="104" font-size="20">interest, extracts their content, and creates personalized AI reading briefs.</text>
      <text class="mono accent" x="74" y="148" font-size="16">PYTHON · PLAYWRIGHT · SCHEDULING · AI SUMMARIZATION</text>
      <path class="accent-stroke round" d="M1028 13h22v22M1050 13l-29 29" fill="none" stroke-width="2.5"/>
      <line class="line" x1="0" y1="182" x2="1056" y2="182"/>
    </g>

    <g transform="translate(0 736)">
      <text class="mono soft" x="0" y="27" font-size="18">04</text>
      <text class="serif ink" x="74" y="30" font-size="36">MineSweeper</text>
      <text class="sans muted" x="74" y="72" font-size="20">A cross-platform C++ console game with mouse control, colorful rendering, flood-fill,</text>
      <text class="sans muted" x="74" y="104" font-size="20">chord clearing, custom grids, first-click protection, timing, and sound effects.</text>
      <text class="mono accent" x="74" y="148" font-size="16">C++ · CONSOLE GRAPHICS · MOUSE INPUT · CROSS-PLATFORM</text>
      <path class="accent-stroke round" d="M1028 13h22v22M1050 13l-29 29" fill="none" stroke-width="2.5"/>
    </g>
  </g>

