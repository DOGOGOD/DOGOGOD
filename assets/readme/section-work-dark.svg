<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Selected work"><title>Selected work</title><style>@font-face{font-family:'g-mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'g-mono',ui-monospace, Menlo, monospace}@font-face{font-family:'g-serif';src:url(data:font/woff2;base64,) format('woff2')}.serif{font-family:'g-serif',Georgia, serif}@font-face{font-family:'g-serif-i';src:url(data:font/woff2;base64,) format('woff2')}.serif-i{font-family:'g-serif-i',Georgia, serif}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
